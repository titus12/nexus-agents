<div id="page-runs" class="page">
  <div class="page-header">
    <div class="page-description">保存 workflow 文本流执行记录、模型路由和节点输出。</div>
    <button class="btn-secondary" type="button" onclick="showToast('已模拟刷新运行记录')">刷新</button>
  </div>

  <div class="toolbar">
    <input type="search" placeholder="搜索 run id / workflow / project" style="max-width:340px">
    <select style="width:150px"><option>全部状态</option><option>Completed</option><option>Waiting</option><option>Failed</option></select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Run</th>
          <th style="width:160px">Project</th>
          <th style="width:110px">状态</th>
          <th style="width:120px">模型组合</th>
          <th style="width:100px">耗时</th>
          <th>摘要</th>
          <th style="width:90px;text-align:right">操作</th>
        </tr>
      </thead>
      <tbody id="run-rows"></tbody>
    </table>
  </div>
</div>
