<div id="page-skills" class="page">
  <div class="page-header">
    <div class="page-description">按模块管理领域知识，支持从项目 `.claude/skills` 导入和后续提升到全局库。</div>
    <button class="btn-primary" type="button" onclick="openSkillDrawer('skill-standard')">新建 Skill</button>
  </div>

  <div class="toolbar">
    <div class="project-filter" id="skill-project-filter"></div>
    <input type="search" placeholder="搜索 skill / 模块 / 触发条件" style="max-width:340px">
    <select style="width:160px"><option>全部模块</option><option>config</option><option>review</option><option>safety</option></select>
    <span class="chip chip-teal">12 imported</span>
    <div class="toolbar-spacer"></div>
    <button class="btn-secondary" type="button" onclick="showToast('已模拟同步 .claude/skills')">同步来源</button>
  </div>

  <div class="asset-grid" id="skill-card-grid"></div>
</div>
