<div id="page-workflows" class="page">
  <div class="page-header">
    <div class="page-description">Workflow Template Library for reusable agent processes. Project workflows can copy templates, diverge locally, and sync manually through diff preview.</div>
    <button class="btn-primary" type="button" onclick="createWorkflow()">新建工作流</button>
  </div>

  <div class="toolbar">
    <input id="workflow-search" type="search" placeholder="查询工作流 / 项目 / 标签" style="max-width:340px" oninput="renderWorkflowList()">
    <select style="width:150px" onchange="renderWorkflowList()">
      <option>全部状态</option>
      <option>Ready</option>
      <option>Draft</option>
      <option>Paused</option>
    </select>
    <div class="toolbar-spacer"></div>
    <button class="btn-secondary" type="button" onclick="showToast('已模拟刷新工作流列表')">刷新</button>
    <button class="btn-primary" type="button" onclick="simulateWorkflowRun()">模拟运行</button>
  </div>

  <div class="workflow-shell">
    <aside class="panel workflow-library">
      <div class="panel-header">
        <div>
          <div class="panel-title">Workflow Library</div>
          <div class="drawer-subtitle">选择一个工作流进入画布编辑。</div>
        </div>
      </div>
      <div class="panel-body">
        <div id="workflow-palette"></div>
        <div class="workflow-list" id="workflow-list"></div>
      </div>
    </aside>

    <section class="workflow-canvas" id="workflow-canvas"></section>

    <aside class="panel" id="workflow-inspector">
      <div class="panel-header"><div class="panel-title">Selected Node</div></div>
      <div class="panel-body muted">选择节点查看配置。</div>
    </aside>
  </div>
</div>
