interface:
  display_name: "WF .NET Feature"
  short_description: "Run the .NET feature-development workflow."
  default_prompt: "$wf-dotnet-feature Add a .NET class-library or hosted-service capability."
workflow_run_header_protocol:
  required_headers:
    - X-Nexus-Workflow-Run-Id
    - X-Nexus-Workflow-Role
  notes: "Keep one Nexus workflow run ID for the workflow and update only the active role header."
