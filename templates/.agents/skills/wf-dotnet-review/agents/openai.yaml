interface:
  display_name: "WF .NET Review"
  short_description: "Run the .NET code-review workflow."
  default_prompt: "$wf-dotnet-review Review a .NET change for compatibility and runtime risk."
workflow_run_header_protocol:
  required_headers:
    - X-Nexus-Workflow-Run-Id
    - X-Nexus-Workflow-Role
  notes: "Keep one Nexus workflow run ID for the workflow and update only the active role header."
