name = "reviewer-perf"
description = "性能审核 — 聚焦 N+1 查询、goroutine 泄漏、内存分配、锁粒度、缓存缺失。用户明确要求并行 reviewer 时可由 sisyphus 调用。"
model = "gpt-5.4"
