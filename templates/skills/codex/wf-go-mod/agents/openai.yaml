interface:
  display_name: "WF Go Modify"
  short_description: "Run the Go existing-feature modification workflow."
  default_prompt: "$wf-go-mod Modify an existing Go feature."
workflow_run_header_protocol:
  required_headers:
    - X-Nexus-Workflow-Run-Id
    - X-Nexus-Workflow-Role
  notes: "Start or reuse one Nexus workflow run ID for the full workflow; update only the role header between stages."

